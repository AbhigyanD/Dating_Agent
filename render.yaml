services:
  - type: web
    name: agentic-dating
    runtime: node
    plan: free               # no persistent disk on free: people added at runtime reset on restart
    buildCommand: echo "no build step"
    startCommand: node server.js
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set in the Render dashboard
      - key: APIFY_TOKEN
        sync: false          # set in the Render dashboard
